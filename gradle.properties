org.gradle.caching = true
org.gradle.jvmargs = -Xms512M -Xmx4096M -XX:+UseG1GC -XX:G1ReservePercent=15 -XX:+UseStringDeduplication
org.gradle.parallel = true
org.gradle.workers.max = 8
org.gradle.priority = normal
org.gradle.vfs.watch = true
android.useAndroidX = true
# Lint skips a source over 2500 KB and fails the build for it. The generated L10nTranslations.java
# passed that size in November 2026, so lint gets room for it to keep growing.
systemProp.idea.max.intellisense.filesize = 8192
kotlin.code.style = official
version = 0.0.19
